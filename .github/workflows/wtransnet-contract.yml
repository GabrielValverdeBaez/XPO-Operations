name: Load Studio checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_source_hashes.py
      - run: python -m pytest -q
      - run: python scripts/check_route.py
      - run: node --check static/app.js
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/smoke_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: |
            evidence/browser-smoke.json
            evidence/ui-desktop.png
            evidence/ui-mobile.png
          if-no-files-found: ignore
