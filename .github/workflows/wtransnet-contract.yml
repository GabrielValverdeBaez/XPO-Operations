name: Wtransnet contract checks
on:
  push:
    paths:
      - 'scripts/validate_wtransnet.py'
      - 'tests/**'
      - '.github/workflows/wtransnet-contract.yml'
  pull_request:
    paths:
      - 'scripts/validate_wtransnet.py'
      - 'tests/**'
      - '.github/workflows/wtransnet-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated contract tests
        run: python -m unittest discover -s tests -v
