name: XPO Cloudflare - read-only release audit

# Audits only XPO's existing Cloudflare Worker.
# Does not deploy, enable routes, read secret values, or modify data.
on:
  push:
    branches:
      - feat/cloudflare-deployment
    paths:
      - '.github/workflows/xpo-cloudflare-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'GabrielValverdeBaez/XPO-Operations' && github.ref == 'refs/heads/feat/cloudflare-deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect version, deployment and login secret metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.XPO_CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          ACCOUNT = '0054188c07d3b5fe7cb20fc4f71dc212'
          WORKER = 'xpo-load-studio'
          prefix = f'https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/workers/scripts/{WORKER}'
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          if not token:
              raise SystemExit('FAIL: missing dedicated XPO_CLOUDFLARE_API_TOKEN in GitHub secrets')

          def get_resource(suffix):
              request = urllib.request.Request(
                  prefix + suffix,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/json',
                  },
                  method='GET',
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      document = json.load(response)
              except urllib.error.HTTPError as exc:
                  return {'available': False, 'reason': 'HTTP ' + str(exc.code)}
              except (urllib.error.URLError, TimeoutError) as exc:
                  return {'available': False, 'reason': type(exc).__name__}
              if document.get('success') is not True:
                  codes = [str(item.get('code', '?')) for item in document.get('errors', [])]
                  return {'available': False, 'reason': 'API ' + ','.join(codes[:3])}
              return {'available': True, 'result': document.get('result')}

          version_reply = get_resource('/versions?per_page=2')
          deployment_reply = get_resource('/deployments?per_page=2')
          secret_reply = get_resource('/secrets')
          settings_reply = get_resource('/settings')

          def items(reply, key):
              if not reply['available']:
                  return None
              result = reply['result']
              if isinstance(result, list):
                  return result
              if isinstance(result, dict):
                  candidate = result.get(key)
                  return candidate if isinstance(candidate, list) else []
              return []

          versions = items(version_reply, 'items')
          deployments = items(deployment_reply, 'deployments')
          secrets = items(secret_reply, 'items')
          latest = versions[0].get('id') if versions else None

          def binding_map(raw):
              # Observe names/types only: ignore values and other sensitive fields.
              if isinstance(raw, list):
                  return {v.get('name'): v.get('type') for v in raw if isinstance(v, dict) and isinstance(v.get('name'), str)}
              if isinstance(raw, dict):
                  return {k: (v.get('type') if isinstance(v, dict) else None) for k, v in raw.items()}
              return {}

          def version_bindings(version_id):
              if not version_id:
                  return None, 'missing version ID'
              reply = get_resource('/versions/' + version_id)
              if not reply['available']:
                  return None, reply['reason']
              result = reply.get('result')
              resources = result.get('resources', {}) if isinstance(result, dict) else {}
              if not isinstance(resources, dict):
                  return None, 'missing resources'
              bindings = resources.get('bindings')
              if bindings is None:
                  return None, 'missing bindings'
              return binding_map(bindings), None

          latest_bindings, latest_error = version_bindings(latest)
          old_secret = None if secrets is None else any(
              isinstance(value, dict) and value.get('name') == 'XPO_LOGIN_KEY'
              for value in secrets
          )
          settings_bindings = None
          if settings_reply['available'] and isinstance(settings_reply.get('result'), dict):
              values = settings_reply['result'].get('bindings')
              if values is not None:
                  settings_bindings = binding_map(values)
          login_version = None if latest_bindings is None else latest_bindings.get('XPO_LOGIN_KEY') in ('secret_text', 'secret_key')
          login_settings = None if settings_bindings is None else settings_bindings.get('XPO_LOGIN_KEY') in ('secret_text', 'secret_key')
          latest_key_exists = None if latest_bindings is None else 'XPO_LOGIN_KEY' in latest_bindings
          latest_key_type = (latest_bindings or {}).get('XPO_LOGIN_KEY')
          if latest_key_type not in ('secret_text', 'secret_key', 'plain_text', None):
              latest_key_type = 'unexpected type'
          latest_source = versions[0].get('metadata', {}).get('source', 'unknown') if versions and isinstance(versions[0], dict) else 'unknown'
          has_db = None if latest_bindings is None else latest_bindings.get('DB') == 'd1'
          has_limiter = None if latest_bindings is None else 'LOGIN_LIMITER' in latest_bindings
          active_versions = deployments[0].get('versions', []) if deployments and isinstance(deployments[0], dict) else []
          active_ids = [v.get('version_id') for v in active_versions if isinstance(v, dict) and v.get('version_id')]
          active_has_login = None
          if active_ids:
              checks = [version_bindings(v)[0] for v in active_ids]
              active_has_login = all(item is not None and item.get('XPO_LOGIN_KEY') in ('secret_text', 'secret_key') for item in checks)

          def status(value, missing_label='unknown'):
              return missing_label if value is None else ('yes' if value else 'no')

          summary = [
              '## XPO Load Studio: remote metadata audit',
              '',
              'Target: `xpo-load-studio` (XPO account only).',
              '',
              '| Check | Result |',
              '|---|---|',
              f"| Version available | {status(bool(versions) if versions is not None else None)} |",
              f"| Latest version ID | `{latest or 'not available'}` |",
              f"| Latest version source | `{latest_source}` |",
              f"| Deployment record exists | {status(bool(deployments) if deployments is not None else None)} |",
              f"| XPO_LOGIN_KEY present as ANY binding in latest version | {status(latest_key_exists)} |",
              f"| XPO_LOGIN_KEY binding kind (not the value) | `{latest_key_type or 'absent'}` |",
              f"| Login Secret in **latest version bindings** | {status(login_version)} |",
              f"| Login Secret in script settings | {status(login_settings)} |",
              f"| Login Secret in current deployment versions | {status(active_has_login)} |",
              f"| D1 binding in latest version | {status(has_db)} |",
              f"| Rate limiter in latest version | {status(has_limiter)} |",
              f"| Legacy script-level secret listing | {status(old_secret)} |",
              '',
              'Only names/types and version metadata were inspected. No secret values, D1 records, or login requests were accessed.',
              'A version is **not** proof of an active public route or successful HTTPS authentication.',
              'Do not enable the production URL until authentication and privacy are checked.',
          ]
          for name, reply in [('versions', version_reply), ('deployments', deployment_reply), ('secrets', secret_reply), ('settings', settings_reply)]:
              if not reply['available']:
                  summary.append(f'- {name}: {reply["reason"]} (status unknown)')
          if latest_error:
              summary.append(f'- latest version details: {latest_error}')
          output = '\n'.join(summary)
          print(output)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(output + '\n')
          # Never fail only because the secret has not yet been set: this is
          # a read-only audit, not authorization to make a release public.
          if versions is None and deployments is None and secrets is None:
              raise SystemExit('Cloudflare metadata could not be read; see the HTTP/API codes above')
          if latest_key_type == 'plain_text' or (settings_bindings is not None and settings_bindings.get('XPO_LOGIN_KEY') == 'plain_text'):
              raise SystemExit('SECURITY BLOCK: XPO_LOGIN_KEY is a plain_text variable. Rotate and recreate it as a Cloudflare Production Secret; no public route is authorized.')
          PY
