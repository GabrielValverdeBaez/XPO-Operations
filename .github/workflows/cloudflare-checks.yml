name: Cloudflare adapter checks
on:
  push:
    branches: ['feat/cloudflare-deployment']
  pull_request:
    paths: ['cloud_adapter/**', 'cloud_assets/**', 'worker.py', 'wrangler.jsonc', 'pyproject.toml', 'package.json', 'scripts/build_cloudflare.py', 'scripts/smoke_cloudflare.py', 'tests/test_cloud_adapter.py', 'static/**', '.github/workflows/cloudflare-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --ignore-scripts
      - run: python scripts/build_cloudflare.py
      - run: python -m pytest -q
      - run: python scripts/check_route.py
      - run: node --check static/app.js && node --check cloud_assets/login.js && node --check cloud_assets/cloud.js
      - name: Bundle without deployment
        run: cd dist/cloudflare && uv run pywrangler deploy --dry-run
      - name: Actual Python Worker and local D1 integration
        run: python scripts/smoke_cloudflare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-runtime-evidence
          path: evidence/cloudflare-runtime.json
          if-no-files-found: ignore
